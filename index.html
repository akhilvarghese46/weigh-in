<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weigh-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#E9EFEC; --surface:#FFFFFF; --sunk:#F2F6F4; --ink:#15302A; --muted:#566B65; --line:#D2DCD8;
  --p1:#1E7A5B; --p1-soft:#DCEFE6; --p2:#B5600C; --p2-soft:#F6E6D2; --on-me:#FFFFFF; --danger:#B42318;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1916; --surface:#162521; --sunk:#1C2D29; --ink:#E4EEEA; --muted:#94A9A3; --line:#2A3D38;
    --p1:#4FC49B; --p1-soft:#1D3A30; --p2:#F2A24E; --p2-soft:#3A2A17; --on-me:#0E1916; --danger:#F97066;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#162521; --sunk:#1C2D29; --ink:#E4EEEA; --muted:#94A9A3; --line:#2A3D38;
  --p1:#4FC49B; --p1-soft:#1D3A30; --p2:#F2A24E; --p2-soft:#3A2A17; --on-me:#0E1916; --danger:#F97066;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;--me:var(--p1);--me-soft:var(--p1-soft)}
body[data-me="p2"]{--me:var(--p2);--me-soft:var(--p2-soft)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
[hidden]{display:none !important}

.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-0.02em;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2;margin:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 4px;font-size:15px}
.linkbtn:hover{color:var(--ink)}

.banner{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;color:var(--muted);font-size:15px}

.grid{display:grid;gap:16px}
@media (min-width:900px){
  .grid{grid-template-columns:400px minmax(0,1fr);align-items:start}
  .left{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
}
.col{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}

/* who is weighing */
.who{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.who button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:16px;padding:10px 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.who button span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.p1{background:var(--p1)} .dot.p2{background:var(--p2)}

/* entry */
.entry{border-top:6px solid var(--me);transition:border-color .2s}
.entry-title{margin-top:16px;color:var(--muted);font-size:15px}
.readout{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
.step{flex:none;width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);font-family:var(--display);font-weight:600;font-size:28px;line-height:1;display:grid;place-items:center}
.step:active{background:var(--me-soft)}
.kg{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;border-bottom:3px solid var(--me);transition:border-color .2s}
.kg input{flex:1;min-width:0;width:100%;border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:64px;line-height:1.05;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-0.03em;padding:2px 0;-moz-appearance:textfield;appearance:textfield}
.kg input::-webkit-outer-spin-button,.kg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.kg input::placeholder{color:var(--line)}
.kg input:focus-visible{outline:none}
.kg:focus-within{background:var(--me-soft);border-radius:10px 10px 0 0}
.kg .u{font-family:var(--display);font-weight:600;font-size:20px;color:var(--muted);padding-right:6px}
.daterow{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.daterow label{color:var(--muted);font-size:15px}
.daterow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;min-height:44px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px;font-size:15px}
.save{width:100%;border:0;background:var(--me);color:var(--on-me);font-weight:700;font-size:18px;border-radius:14px;min-height:54px;transition:background .2s}
.save:disabled{opacity:.6;cursor:default}
.status{min-height:24px;margin:10px 0 0;font-size:15px;color:var(--muted)}
.status.err{color:var(--danger)}
.del{display:block;margin:4px auto 0;color:var(--danger)}
.del:hover{color:var(--danger)}

/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.stat .who-name{display:flex;align-items:center;gap:8px;font-weight:700;overflow:hidden}
.stat .who-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .big small{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .when{color:var(--muted);font-size:14px}
.stat dl{margin:10px 0 0;display:grid;gap:2px;font-size:14px}
.stat dl div{display:flex;justify-content:space-between;gap:8px}
.stat dt{color:var(--muted)}
.stat dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.stat .empty{color:var(--muted);font-size:14px;margin-top:8px}

/* chart */
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px 14px;border-radius:9px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart-sub{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:10px 0 6px}
.legend{display:flex;gap:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chartbox{position:relative;height:300px}
.chartbox .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}

/* history */
.hist-scroll{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:700;font-size:14px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th .dot{margin-right:6px;vertical-align:middle}
td{padding:2px 6px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.d{white-space:nowrap;color:var(--muted);font-size:15px}
td.today{color:var(--ink);font-weight:700}
.cell{display:flex;align-items:baseline;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:10px 6px;border-radius:8px;min-height:44px}
button.cell:hover{background:var(--sunk)}
.cell b{font-size:17px}
.cell i{font-style:normal;font-size:13px;color:var(--muted)}
.cell.none{color:var(--muted)}
.more{display:block;margin:10px auto 0}
.hist-empty{color:var(--muted);margin:12px 0 0}

dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:15px;color:var(--muted);margin-top:14px}
dialog input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;min-height:44px;margin-top:4px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.dlg-actions .save{width:auto;padding:0 20px;min-height:44px;font-size:16px}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
.top-actions{display:flex;gap:4px}
.sync{margin:-8px 0 16px;color:var(--muted);font-size:14px;min-height:21px}
.sync.err{color:var(--danger)}
.setup{background:var(--me-soft);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.setup p{margin:0 0 10px}
.setup .save{width:auto;padding:0 18px;min-height:44px;font-size:16px}
dialog .hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.dlg-actions .linkbtn{margin-right:auto;color:var(--danger)}
</style>
</head>
<body data-me="p1">
<div class="wrap">
  <div class="top">
    <h1>Weigh-in</h1>
    <div class="top-actions">
      <button class="linkbtn" id="refreshBtn" type="button">Refresh</button>
      <button class="linkbtn" id="settingsBtn" type="button">Settings</button>
    </div>
  </div>
  <p class="sync" id="sync" aria-live="polite"></p>

  <div class="setup" id="setup" hidden>
    <p>Connect this device to GitHub once, and every weigh-in is saved to your weights file there.</p>
    <button class="save" id="setupBtn" type="button">Connect to GitHub</button>
  </div>

  <div class="grid">
    <div class="col left">
      <section class="panel entry" id="entryPanel" aria-labelledby="entryTitle">
        <div class="who" id="who" role="group" aria-label="Who is weighing in"></div>
        <form id="entryForm" novalidate>
          <p class="entry-title" id="entryTitle"></p>
          <div class="readout">
            <button type="button" class="step" data-step="-0.1" aria-label="Decrease by 0.1 kilograms">−</button>
            <div class="kg">
              <input id="kg" type="number" inputmode="decimal" step="0.1" min="20" max="350" placeholder="00.0" aria-label="Weight in kilograms" autocomplete="off">
              <span class="u">kg</span>
            </div>
            <button type="button" class="step" data-step="0.1" aria-label="Increase by 0.1 kilograms">+</button>
          </div>
          <div class="daterow">
            <label for="dateInput">Date</label>
            <input id="dateInput" type="date">
            <button type="button" class="chip" id="todayBtn">Today</button>
          </div>
          <button class="save" id="saveBtn" type="submit">Save weight</button>
          <p class="status" id="status" aria-live="polite"></p>
          <button type="button" class="linkbtn del" id="delBtn" hidden>Delete this entry</button>
        </form>
      </section>

      <section class="summary" id="summary" aria-label="Progress so far"></section>
    </div>

    <div class="col">
      <section class="panel" aria-labelledby="chartTitle">
        <div class="chart-head">
          <h2 id="chartTitle">Progress</h2>
          <div class="seg" role="group" aria-label="Graph view">
            <button type="button" data-view="daily" aria-pressed="true">Daily</button>
            <button type="button" data-view="weekly" aria-pressed="false">Weekly</button>
          </div>
        </div>
        <div class="chart-sub">
          <span id="chartCaption">Last 30 days</span>
          <span class="legend" id="legend"></span>
        </div>
        <div class="chartbox">
          <canvas id="chart" aria-label="Weight graph" role="img"></canvas>
          <div class="msg" id="chartMsg" hidden></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="histTitle">
        <h2 id="histTitle">All weigh-ins</h2>
        <div class="hist-scroll"><table id="hist"></table></div>
        <p class="hist-empty" id="histEmpty" hidden>No weigh-ins yet. Add today’s weight to get started.</p>
        <button type="button" class="linkbtn more" id="moreBtn" hidden>Show all</button>
      </section>
    </div>
  </div>
</div>

<dialog id="ghDlg" aria-labelledby="ghTitle">
  <form method="dialog" id="ghForm">
    <h2 id="ghTitle">GitHub connection</h2>
    <label for="ghOwner">GitHub username</label>
    <input id="ghOwner" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="ghRepo">Data repository</label>
    <input id="ghRepo" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="ghPath">File</label>
    <input id="ghPath" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="ghBranch">Branch</label>
    <input id="ghBranch" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="ghToken">Access token</label>
    <input id="ghToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
    <p class="hint">Saved on this device only, never in the code or the repo.</p>
    <div class="dlg-actions">
      <button type="button" class="linkbtn" id="ghForget">Remove token</button>
      <button type="button" class="chip" id="ghCancel">Cancel</button>
      <button type="submit" class="save">Save and connect</button>
    </div>
  </form>
</dialog>

<script>
/* ===== Edit these to match your GitHub setup ===== */
const CONFIG = {
  owner: 'akhilvarghese46',  // your GitHub username
  repo: 'weigh-in-data',     // private repo that holds the weights file
  branch: 'main',
  path: 'weights.json',
  people: { p1: 'Akhil', p2: 'Meethu' }   // these are also the keys in weights.json
};
/* ================================================= */

(function(){
  const PEOPLE = ['p1','p2'];
  const NAMES = CONFIG.people;
  const ls = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  const state = {
    entries:[], raw:{}, who: ls.get('wt-who') === 'p2' ? 'p2' : 'p1',
    view: ls.get('wt-view') === 'weekly' ? 'weekly' : 'daily',
    showAll:false, loading:false, busy:false
  };
  let gh = { owner:CONFIG.owner, repo:CONFIG.repo, branch:CONFIG.branch, path:CONFIG.path, token:'' };
  try{ Object.assign(gh, JSON.parse(ls.get('wt-gh') || '{}')); }catch(e){}
  const configured = () => !!(gh.owner && gh.repo && gh.token);

  const $ = s => document.querySelector(s);
  function el(tag, attrs, kids){
    const n = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === 'text') n.textContent = attrs[k];
      else if(k === 'class') n.className = attrs[k];
      else if(k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(c => c && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return n;
  }

  /* ---------- dates ---------- */
  function toStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fromStr(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
  const todayStr = () => toStr(new Date());
  function addDays(s,n){ const d = fromStr(s); d.setDate(d.getDate()+n); return toStr(d); }
  function mondayOf(s){ const d = fromStr(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return toStr(d); }
  const fmtShort = s => fromStr(s).toLocaleDateString('en-IE',{day:'numeric',month:'short'});
  const fmtLong = s => fromStr(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});
  const fmtKg = n => (Math.round(n*10)/10).toFixed(1);
  function signed(n){
    const r = Math.round(n*10)/10;
    if(r === 0) return '±0.0';
    return (r > 0 ? '+' : '−') + Math.abs(r).toFixed(1);
  }

  /* ---------- data helpers ---------- */
  const entryFor = (p,d) => state.entries.find(e => e.person === p && e.date === d);
  function listFor(p){ return state.entries.filter(e => e.person === p).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
  function lastOnOrBefore(p,d){
    let best = null;
    for(const e of state.entries) if(e.person === p && e.date <= d && (!best || e.date > best.date)) best = e;
    return best;
  }
  const upsert = (list, e) => list.filter(x => !(x.person === e.person && x.date === e.date)).concat([e]);
  const removeOne = (list, p, d) => list.filter(x => !(x.person === p && x.date === d));

  /* weights.json  <->  entries */
  function fromJson(obj){
    const out = [];
    PEOPLE.forEach(p => {
      const arr = obj && Array.isArray(obj[NAMES[p]]) ? obj[NAMES[p]] : [];
      arr.forEach(x => {
        const kg = Number(x && x.weight);
        if(x && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && isFinite(kg)) out.push({person:p, date:x.date, kg});
      });
    });
    return out;
  }
  function toJson(base, entries){
    const obj = Object.assign({}, base && typeof base === 'object' && !Array.isArray(base) ? base : {});
    PEOPLE.forEach(p => {
      obj[NAMES[p]] = entries.filter(e => e.person === p)
        .sort((a,b) => a.date < b.date ? -1 : 1)
        .map(e => ({ date:e.date, weight: Math.round(e.kg*10)/10 }));
    });
    return obj;
  }

  /* ---------- GitHub storage ---------- */
  function b64encode(str){ const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
  function b64decode(b64){ const bin = atob(String(b64).replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
  const repoUrl = () => 'https://api.github.com/repos/' + encodeURIComponent(gh.owner) + '/' + encodeURIComponent(gh.repo);
  const fileUrl = () => repoUrl() + '/contents/' + gh.path.split('/').map(encodeURIComponent).join('/');
  const headers = () => ({ 'Authorization':'Bearer ' + gh.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' });

  async function fetchFile(){
    const r = await fetch(fileUrl() + '?ref=' + encodeURIComponent(gh.branch), { headers: headers(), cache:'no-store' });
    if(r.status === 404){
      const rr = await fetch(repoUrl(), { headers: headers(), cache:'no-store' });
      if(rr.ok) return { sha:null, data:{} };            // repo exists, file not created yet
      throw { status: rr.status === 404 ? 404 : rr.status };
    }
    if(!r.ok) throw { status:r.status };
    const j = await r.json();
    let data = {};
    try{ data = JSON.parse(b64decode(j.content) || '{}'); }catch(e){ throw { status:'badjson' }; }
    return { sha:j.sha, data };
  }

  /* Read the latest file, apply the change, write it back. Retries if the other phone saved at the same moment. */
  async function commit(change, message){
    for(let attempt = 0; attempt < 3; attempt++){
      const { sha, data } = await fetchFile();
      const next = change(fromJson(data));
      const text = JSON.stringify(toJson(data, next), null, 2) + '\n';
      const body = { message, content: b64encode(text), branch: gh.branch };
      if(sha) body.sha = sha;
      const r = await fetch(fileUrl(), { method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, headers()), body: JSON.stringify(body) });
      if(r.ok){ state.entries = next; state.raw = toJson(data, next); return; }
      if(r.status === 409 || r.status === 422){ await new Promise(res => setTimeout(res, 400 + Math.random()*600)); continue; }
      throw { status:r.status };
    }
    throw { status:'conflict' };
  }

  function errText(e){
    const s = e && e.status;
    if(e instanceof TypeError) return 'Couldn’t reach GitHub. Check your connection and try again.';
    if(s === 401) return 'GitHub rejected the access token. It may be mistyped or expired. Update it in Settings.';
    if(s === 403) return 'The token can’t write to ' + gh.repo + '. Give it “Contents: Read and write” for that repository.';
    if(s === 404) return 'Can’t find ' + gh.owner + '/' + gh.repo + '. Check the names in Settings and that the token includes this repository.';
    if(s === 'conflict') return 'Both phones saved at the same moment. Tap Save again.';
    if(s === 'badjson') return gh.path + ' isn’t valid JSON. Fix the file on GitHub, then tap Refresh.';
    return 'GitHub returned an error' + (s ? ' (' + s + ')' : '') + '. Try again.';
  }
  function setSync(text, err){ const s = $('#sync'); s.textContent = text; s.classList.toggle('err', !!err); }
  const syncedText = () => 'Up to date with GitHub, checked at ' + new Date().toLocaleTimeString('en-IE', {hour:'2-digit', minute:'2-digit'});

  async function pull(silent){
    $('#setup').hidden = configured();
    if(!configured()){ setSync(''); render(); return; }
    if(state.busy) return;
    if(!silent){ state.loading = !state.entries.length; setSync('Loading weights from GitHub…'); render(); }
    try{
      const f = await fetchFile();
      if(state.busy) return;
      state.entries = fromJson(f.data); state.raw = f.data;
      setSync(syncedText());
    }catch(e){ setSync(errText(e), true); }
    state.loading = false;
    render();
  }

  /* ---------- UI state ---------- */
  const form = { date: todayStr(), dirty:false };
  let delArmed = null;
  function setStatus(text, err){ const s = $('#status'); s.textContent = text; s.classList.toggle('err', !!err); }

  function loadForm(){
    const ex = entryFor(state.who, form.date);
    const prev = lastOnOrBefore(state.who, form.date);
    $('#kg').value = ex ? fmtKg(ex.kg) : (prev ? fmtKg(prev.kg) : '');
    form.dirty = false;
    formChrome();
  }
  function formChrome(){
    const name = NAMES[state.who];
    const ex = entryFor(state.who, form.date);
    const isToday = form.date === todayStr();
    $('#entryTitle').textContent = (isToday ? name + '’s weight today' : name + '’s weight on ' + fmtLong(form.date)) + (ex ? ' (saved)' : '');
    $('#saveBtn').textContent = ex ? 'Update weight' : 'Save weight';
    $('#delBtn').hidden = !ex;
    $('#dateInput').value = form.date;
    $('#dateInput').max = todayStr();
    $('#todayBtn').hidden = isToday;
    if(!ex) disarmDelete();
  }
  function disarmDelete(){
    if(delArmed){ clearTimeout(delArmed); delArmed = null; }
    $('#delBtn').textContent = 'Delete this entry';
  }
  function readKg(){
    const v = parseFloat(String($('#kg').value).replace(',', '.'));
    return isFinite(v) ? v : null;
  }

  async function runChange(optimistic, change, message, okText){
    const before = state.entries;
    state.entries = optimistic(state.entries);
    state.busy = true; $('#saveBtn').disabled = true;
    setSync('Saving to GitHub…'); render();
    try{
      await commit(change, message);
      form.dirty = false;
      setStatus(okText); setSync(syncedText());
    }catch(err){
      state.entries = before;
      setStatus(errText(err), true); setSync('');
    }finally{
      state.busy = false; $('#saveBtn').disabled = false; render();
    }
  }

  $('#entryForm').addEventListener('submit', ev => {
    ev.preventDefault();
    if(state.busy) return;
    if(!configured()){ setStatus('Connect to GitHub first, then save.', true); openSettings(); return; }
    const v = readKg();
    if(v === null || v < 20 || v > 350){ setStatus('Enter a weight between 20 and 350 kg.', true); $('#kg').focus(); return; }
    const e = { person:state.who, date:form.date, kg: Math.round(v*10)/10 };
    const name = NAMES[e.person];
    runChange(list => upsert(list, e), list => upsert(list, e),
      name + ': ' + fmtKg(e.kg) + ' kg on ' + e.date,
      'Saved ' + fmtKg(e.kg) + ' kg for ' + name + ', ' + fmtLong(e.date) + '.');
  });
  $('#kg').addEventListener('input', () => { form.dirty = true; setStatus(''); });
  document.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => {
    let v = readKg();
    if(v === null){ const prev = lastOnOrBefore(state.who, form.date); v = prev ? prev.kg : 70; }
    v = Math.round((v + parseFloat(b.dataset.step)) * 10) / 10;
    $('#kg').value = fmtKg(Math.min(350, Math.max(20, v)));
    form.dirty = true; setStatus('');
  }));
  $('#dateInput').addEventListener('change', e => {
    const v = e.target.value;
    form.date = (v && v <= todayStr()) ? v : todayStr();
    setStatus(''); loadForm();
  });
  $('#todayBtn').addEventListener('click', () => { form.date = todayStr(); setStatus(''); loadForm(); });
  $('#delBtn').addEventListener('click', () => {
    if(state.busy) return;
    if(!delArmed){
      $('#delBtn').textContent = 'Tap again to delete';
      delArmed = setTimeout(disarmDelete, 4000);
      return;
    }
    disarmDelete();
    const p = state.who, d = form.date;
    runChange(list => removeOne(list, p, d), list => removeOne(list, p, d),
      'Delete ' + NAMES[p] + ' on ' + d,
      'Deleted ' + NAMES[p] + '’s entry for ' + fmtLong(d) + '.');
  });

  function selectWho(p){
    state.who = p; ls.set('wt-who', p);
    document.body.dataset.me = p;
    setStatus(''); renderWho(); loadForm();
  }

  /* ---------- settings ---------- */
  const dlg = $('#ghDlg');
  function openSettings(){
    $('#ghOwner').value = gh.owner; $('#ghRepo').value = gh.repo;
    $('#ghPath').value = gh.path; $('#ghBranch').value = gh.branch; $('#ghToken').value = gh.token;
    if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  }
  const closeSettings = () => dlg.close ? dlg.close() : dlg.removeAttribute('open');
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#setupBtn').addEventListener('click', openSettings);
  $('#ghCancel').addEventListener('click', closeSettings);
  $('#ghForget').addEventListener('click', () => {
    gh.token = ''; ls.set('wt-gh', JSON.stringify(gh));
    state.entries = []; closeSettings(); pull();
  });
  $('#ghForm').addEventListener('submit', ev => {
    ev.preventDefault();
    gh = {
      owner: $('#ghOwner').value.trim(),
      repo: $('#ghRepo').value.trim() || CONFIG.repo,
      path: $('#ghPath').value.trim().replace(/^\/+/, '') || CONFIG.path,
      branch: $('#ghBranch').value.trim() || CONFIG.branch,
      token: $('#ghToken').value.trim()
    };
    ls.set('wt-gh', JSON.stringify(gh));
    closeSettings(); pull();
  });
  $('#refreshBtn').addEventListener('click', () => pull());

  /* ---------- rendering ---------- */
  function renderWho(){
    const box = $('#who'); box.textContent = '';
    PEOPLE.forEach(p => {
      box.appendChild(el('button', {type:'button', 'aria-pressed': String(state.who === p), onclick: () => selectWho(p)}, [
        el('span', {class:'dot ' + p}), el('span', {class:'n', text: NAMES[p]})
      ]));
    });
  }

  function renderSummary(){
    const box = $('#summary'); box.textContent = '';
    PEOPLE.forEach(p => {
      const list = listFor(p);
      const card = el('div', {class:'stat'}, [
        el('div', {class:'who-name'}, [el('span', {class:'dot ' + p}), el('span', {text: NAMES[p]})])
      ]);
      if(!list.length){
        card.appendChild(el('p', {class:'empty', text: state.loading ? 'Loading…' : 'No weigh-ins yet'}));
      } else {
        const last = list[list.length-1], first = list[0];
        const cutoff = addDays(last.date, -7);
        let weekRef = null;
        for(const e of list) if(e.date <= cutoff) weekRef = e;
        card.appendChild(el('div', {class:'big'}, [fmtKg(last.kg), el('small', {text:'kg'})]));
        card.appendChild(el('div', {class:'when', text: last.date === todayStr() ? 'Today' : fmtLong(last.date)}));
        const rows = [];
        if(weekRef) rows.push(['Last 7 days', signed(last.kg - weekRef.kg) + ' kg']);
        if(list.length > 1) rows.push(['Since ' + fmtShort(first.date), signed(last.kg - first.kg) + ' kg']);
        if(rows.length) card.appendChild(el('dl', null, rows.map(r => el('div', null, [el('dt', {text:r[0]}), el('dd', {text:r[1]})]))));
      }
      box.appendChild(card);
    });
  }

  let chart = null, chartFirst = true;
  function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
  function chartSeries(){
    const today = todayStr();
    if(state.view === 'daily'){
      const days = [];
      for(let i = 29; i >= 0; i--) days.push(addDays(today, -i));
      return { labels: days.map(fmtShort), sets: PEOPLE.map(p => days.map(d => { const e = entryFor(p,d); return e ? e.kg : null; })) };
    }
    const mon = mondayOf(today), weeks = [];
    for(let i = 11; i >= 0; i--) weeks.push(addDays(mon, -7*i));
    return {
      labels: weeks.map(fmtShort),
      sets: PEOPLE.map(p => weeks.map(w => {
        const xs = state.entries.filter(e => e.person === p && mondayOf(e.date) === w).map(e => e.kg);
        return xs.length ? Math.round(xs.reduce((a,b) => a+b, 0) / xs.length * 10) / 10 : null;
      }))
    };
  }
  function renderChart(){
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
    $('#chartCaption').textContent = state.view === 'daily' ? 'Each day, last 30 days' : 'Weekly average (Mon–Sun), last 12 weeks';
    const lg = $('#legend'); lg.textContent = '';
    PEOPLE.forEach(p => lg.appendChild(el('span', null, [el('span', {class:'dot ' + p}), NAMES[p]])));

    const msg = $('#chartMsg'), canvas = $('#chart');
    if(typeof Chart === 'undefined'){
      msg.textContent = 'The graph couldn’t load. Check your connection and reload.'; msg.hidden = false; canvas.hidden = true; return;
    }
    const {labels, sets} = chartSeries();
    if(!sets.some(s => s.some(v => v !== null))){
      if(chart){ chart.destroy(); chart = null; }
      msg.textContent = state.loading ? 'Loading…' : (state.entries.length ? 'No weigh-ins in this period yet.' : 'Add your first weigh-in to see the graph.');
      msg.hidden = false; canvas.hidden = true; return;
    }
    msg.hidden = true; canvas.hidden = false;
    const muted = cssVar('--muted'), line = cssVar('--line'), body = cssVar('--body');
    const datasets = PEOPLE.map((p,i) => {
      const c = cssVar('--' + p);
      return { label: NAMES[p], data: sets[i], borderColor: c, backgroundColor: c,
        pointRadius: state.view === 'daily' ? 3 : 4, pointHoverRadius: 6, borderWidth: 2.5, tension: .25, spanGaps: true };
    });
    if(chart) chart.destroy();
    chart = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: chartFirst && !matchMedia('(prefers-reduced-motion: reduce)').matches ? {duration: 500} : false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { filter: item => item.parsed.y !== null, callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + ' kg' } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: muted, maxRotation: 0, autoSkip: true, maxTicksLimit: 6, font: { family: body } } },
          y: { grace: '8%', grid: { color: line }, border: { display: false }, ticks: { color: muted, maxTicksLimit: 6, font: { family: body }, callback: v => Number(v).toFixed(1) } }
        }
      }
    });
    chartFirst = false;
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.view; ls.set('wt-view', state.view); renderChart();
  }));

  function renderHistory(){
    const table = $('#hist'); table.textContent = '';
    const dates = [...new Set(state.entries.map(e => e.date))].sort().reverse();
    $('#histEmpty').hidden = dates.length > 0 || state.loading;
    if(!dates.length){ $('#moreBtn').hidden = true; return; }
    const prevMap = {};
    PEOPLE.forEach(p => { const list = listFor(p); list.forEach((e,i) => { prevMap[p + '_' + e.date] = i > 0 ? list[i-1].kg : null; }); });
    table.appendChild(el('thead', null, [el('tr', null, [
      el('th', {text:'Date'}),
      ...PEOPLE.map(p => el('th', null, [el('span', {class:'dot ' + p}), NAMES[p]]))
    ])]));
    const tb = el('tbody');
    const today = todayStr();
    (state.showAll ? dates : dates.slice(0, 21)).forEach(d => {
      const tr = el('tr', null, [el('td', {class:'d' + (d === today ? ' today' : ''), text: d === today ? 'Today' : fmtLong(d)})]);
      PEOPLE.forEach(p => {
        const e = entryFor(p, d);
        const prev = prevMap[p + '_' + d];
        const kids = e ? [el('b', {text: fmtKg(e.kg)}), (prev !== null && prev !== undefined) ? el('i', {text: signed(e.kg - prev)}) : null] : ['—'];
        tr.appendChild(el('td', null, [el('button', {
          type:'button', class:'cell' + (e ? '' : ' none'),
          'aria-label': (e ? 'Edit ' : 'Add ') + NAMES[p] + '’s weight for ' + fmtLong(d),
          onclick: () => {
            form.date = d; setStatus('');
            if(state.who !== p) selectWho(p); else loadForm();
            if(window.innerWidth < 900) $('#entryPanel').scrollIntoView({behavior:'smooth', block:'start'});
            $('#kg').focus({preventScroll:true});
          }
        }, kids)]));
      });
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    const more = $('#moreBtn');
    more.hidden = dates.length <= 21;
    more.textContent = state.showAll ? 'Show fewer' : 'Show all ' + dates.length + ' days';
  }
  $('#moreBtn').addEventListener('click', () => { state.showAll = !state.showAll; renderHistory(); });

  function render(){
    document.body.dataset.me = state.who;
    renderWho();
    if(form.dirty) formChrome(); else loadForm();
    renderSummary();
    renderChart();
    renderHistory();
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderChart);

  /* keep both phones in step: re-check when the page comes back to the front, and every minute while open */
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pull(true); });
  setInterval(() => { if(document.visibilityState === 'visible' && !form.dirty) pull(true); }, 60000);

  pull();
})();
</script>
</body>
</html>
